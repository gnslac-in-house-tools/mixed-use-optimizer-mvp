<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- GFit's mark (the Home sidebar's): a rounded tile with a gabled hall; it turns light on a dark browser. -->
  <style>
    .tile { fill: #1d1d1f; } .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) { .tile { fill: #f5f5f7; } .mark { stroke: #1d1d1f; } }
  </style>
  <rect class="tile" width="32" height="32" rx="9" />
  <g class="mark" transform="translate(5 5) scale(0.9167)" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V9l8-5 8 5v11" /><path d="M4 14h16" />
  </g>
</svg>
